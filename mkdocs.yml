site_name: Azure OpenAI Foundry Model Availability
site_description: Track Azure OpenAI Foundry model availability across regions and SKUs
site_url: https://jinlee794.github.io/foundry-model-availability-notifications/
repo_url: https://github.com/JinLee794/foundry-model-availability-notifications
repo_name: JinLee794/foundry-model-availability-notifications

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.tooltips
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

validation:
  links:
    unrecognized_links: ignore

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/custom.css
  - https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css
  - https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css

extra_javascript:
  - https://code.jquery.com/jquery-3.7.1.min.js
  - https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js
  - https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js
  - https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js
  - javascripts/tables.js
  - javascripts/dashboard.js
  - javascripts/explorer.js
  - javascripts/planner.js
  - javascripts/cost.js

nav:
  - Dashboard: index.md
  - Explorer: explorer.md
  - Models: models/index.md
  - Deployment & PTU: ptu.md
  - Cost planner: cost.md
  - Lifecycle: lifecycle.md
  - Retirements: retirements.md
  - Change History: history.md
